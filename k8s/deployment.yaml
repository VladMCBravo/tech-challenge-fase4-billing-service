apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  labels:
    app: billing-service
    tags.datadoghq.com/service: "billing-service"
    tags.datadoghq.com/env: "production"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
        tags.datadoghq.com/service: "billing-service"
        tags.datadoghq.com/env: "production"
      annotations:
        ad.datadoghq.com/api.logs: '[{"source":"nodejs","service":"billing-service"}]'
    spec:
      # A aplicação não acessa a API do Kubernetes: não monta o token da service account
      automountServiceAccountToken: false
      initContainers:
        - name: migrate
          image: 538889416411.dkr.ecr.us-east-1.amazonaws.com/oficina-billing-service:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - 'echo "Sincronizando schema do Billing Service..." && npx prisma db push --schema prisma/schema.prisma'
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: billing-service-secrets
                  key: DATABASE_URL
          resources:
            requests:
              ephemeral-storage: "64Mi"
              memory: "128Mi"
              cpu: "50m"
            limits:
              ephemeral-storage: "512Mi"
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: api
          image: 538889416411.dkr.ecr.us-east-1.amazonaws.com/oficina-billing-service:latest
          imagePullPolicy: Always
          command: ['/bin/sh', '-c', '[ -f dist/src/main.js ] && node dist/src/main.js || node dist/main.js']
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: billing-service-secrets
          env:
            - name: PORT
              value: "3001"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq-service:5672"
            - name: RABBITMQ_QUEUE
              value: "billing-service.saga.queue"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_ENV
              value: "production"
            - name: DD_SERVICE
              value: "billing-service"
            - name: DD_VERSION
              value: "4.0.0"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              ephemeral-storage: "64Mi"
              memory: "128Mi"
              cpu: "100m"
            limits:
              ephemeral-storage: "512Mi"
              memory: "256Mi"
              cpu: "200m"
