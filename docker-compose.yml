version: '3.9'

services:
  postgres-billing:
    image: postgres:16-alpine
    container_name: oficina-postgres-billing
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: billing_db
    ports:
      - '5433:5432'

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: oficina-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'

  billing-service:
    build: .
    container_name: oficina-billing-service
    depends_on:
      - postgres-billing
      - rabbitmq
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres-billing:5432/billing_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_QUEUE: billing-service.saga.queue
      JWT_SECRET: super-secret-jwt-oficina-soat
    ports:
      - '3001:3001'
